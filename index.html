  $('#ox').innerHTML=opts.map((o,i)=>`<div class="orow"><input class="f" placeholder="Option (e.g. Color)" value="${esc(o.name)}" oninput="opts[${i}].name=this.value"><input class="f" placeholder="Values, comma separated" value="${esc((o.values||[]).join(', '))}" oninput="opts[${i}].values=this.value.split(',').map(x=>x.trim()).filter(Boolean)"><button class="ic" onclick="opts.splice(${i},1);drawOx()" aria-label="Remove">✕</button></div>`).join('');
  $('#sx').innerHTML=specs.map((o,i)=>`<div class="orow"><input class="f" placeholder="e.g. Screen" value="${esc(o.k)}" oninput="specs[${i}].k=this.value"><input class="f" placeholder='e.g. 6.4" AMOLED' value="${esc(o.v)}" oninput="specs[${i}].v=this.value"><button class="ic" onclick="specs.splice(${i},1);drawOx()" aria-label="Remove">✕</button></div>`).join('')}
function drawImgs(){$('#im').innerHTML=imgs.map((u,i)=>`<div><img src="${u}" alt=""><button onclick="imgs.splice(${i},1);drawImgs()">✕</button></div>`).join('')}
function shrink(file,max=640){return new Promise(res=>{const i=new Image,u=URL.createObjectURL(file);i.onload=()=>{const s=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.72))};i.src=u})}
async function addImgs(inp){for(const f of[...inp.files]){if(imgs.length>=4){toast('Max 4 photos');break}imgs.push(await shrink(f));drawImgs()}inp.value=''}
async function saveProd(){
  const name=$('#pn').value.trim(),price=num('#pp');
  if(!name||!price)return toast('Add a name and price');
  const id=eid||'P'+Date.now().toString(36);
  await DB.set('products',id,{name,category:$('#pc').value.trim()||'General',tag:$('#pt').value,price,oldPrice:num('#po'),stock:Number($('#ps').value)||0,desc:$('#pd').value.trim(),images:imgs,active:true,
    options:opts.filter(o=>o.name.trim()&&o.values.length).map(o=>({name:o.name.trim(),values:o.values})),specs:specs.filter(s=>s.k.trim()&&s.v.trim()),noRefund:$('#pnr').checked,sold:(P.find(x=>x.id===id)?.sold)||0});
  closeSh();toast('Product saved ✓')}
async function delProd(id){if(confirm('Delete this product?')){await DB.del('products',id);toast('Product deleted')}}

const cst=c=>c.active===false?'Off':c.expiresAt&&Date.now()>c.expiresAt?'Expired':c.limit&&(c.used||0)>=c.limit?'Full':'Live';
const left=ms=>{const m=Math.floor(ms/6e4);return m>=1440?Math.floor(m/1440)+'d left':m>=60?Math.floor(m/60)+'h left':Math.max(m,1)+'m left'};
function lCpn(){
  const q=Q.cpn.trim().toLowerCase();
  return C.filter(c=>!q||c.code.toLowerCase().includes(q)||(c.creator||'').toLowerCase().includes(q)).map(c=>`<div class="row"><div class="grow"><div class="nm">${esc(c.code)} <span class="tag">${cst(c)}</span></div>${c.creator?`<div class="sd">🤝 ${esc(c.creator)}</div>`:''}<div class="sd">${esc(cdesc(c))}</div><div class="sd">Used ${c.used||0}${c.limit?' of '+c.limit+' slots':''}${c.expiresAt&&cst(c)==='Live'?' · '+left(c.expiresAt-Date.now()):''}${c.perCustomer!==false?' · 1 per customer':''}</div></div><button class="ic" onclick="navigator.clipboard&&navigator.clipboard.writeText('${esc(c.code)}');toast('Code copied')" aria-label="Copy">⧉</button><button class="ic" onclick="togCpn('${c.id}')" aria-label="On or off">${c.active===false?'▶':'⏸'}</button><button class="ic" onclick="delCpn('${c.id}')" aria-label="Delete">🗑</button></div>`).join('')||'<div class="sd" style="padding:30px 0;text-align:center">No codes found.</div>'}
function openCpn(){
  sh(`<h2>New promo code</h2><label>Creator / brand partner (optional)</label><input class="f" id="kcr" placeholder="e.g. @tunde_tech">
  <label>Code</label><div style="display:flex;gap:8px"><input class="f" id="kc" placeholder="e.g. TUNDE10" style="text-transform:uppercase"><button class="btn o" style="margin-top:6px;white-space:nowrap" onclick="$('#kc').value=gen()">Generate</button></div>
  <label>What does it give?</label><select class="f" id="kt" onchange="ctype()"><option value="percent">% off the order</option><option value="freedel">Free delivery</option><option value="free">Free item (gift, pouch, anything)</option><option value="other">Other (describe it)</option></select>
  <div id="kv"><label>Percent off</label><input class="f" id="kp" type="number" min="1" max="100" value="10"></div>
  <div id="ki" style="display:none"><label id="kil">Free what?</label><input class="f" id="kn" placeholder="pouch"></div>
  <label>Minimum order (₦, optional)</label><input class="f money" id="km" inputmode="numeric" placeholder="e.g. 500,000">
  <label>Slots: only the first N customers (0 = unlimited)</label><input class="f" id="kl" type="number" min="0" value="20">
  <label>How long does it work?</label><select class="f" id="kd2" onchange="$('#kd').style.display=this.value==='date'?'block':'none'">${[['0','No time limit'],['1','1 hour'],['6','6 hours'],['24','1 day'],['72','3 days'],['168','7 days'],['720','30 days'],['date','Pick an end date and time']].map(([v,t])=>`<option value="${v}">${t}</option>`).join('')}</select>
  <input class="f" id="kd" type="datetime-local" style="display:none">
  <label class="chk"><input type="checkbox" id="kpc" checked> One use per customer</label>
  <div style="display:flex;gap:8px;margin-top:16px"><button class="btn o" style="flex:1" onclick="closeSh()">Cancel</button><button class="btn" style="flex:1" onclick="saveCpn()">Create code</button></div>`);ctype()}
function ctype(){const t=$('#kt').value;$('#kv').style.display=t==='percent'?'block':'none';$('#ki').style.display=t==='free'||t==='other'?'block':'none';$('#kil').textContent=t==='other'?'Describe the offer':'Free what? (e.g. pouch)'}
async function saveCpn(){
  const code=$('#kc').value.trim().toUpperCase(),type=$('#kt').value,value=Number($('#kp').value)||0,item=$('#kn').value.trim(),dv=$('#kd2').value;
  if(!code)return toast('Add or generate a code');
  if(C.some(c=>c.code===code))return toast('That code already exists');
  if(type==='percent'&&(value<1||value>100))return toast('Percent must be 1 to 100');
  if((type==='free'||type==='other')&&!item)return toast('Say what the customer gets');
  let exp=0;if(dv==='date'){exp=new Date($('#kd').value).getTime();if(!exp||exp<Date.now())return toast('Pick a future end date')}else if(dv!=='0')exp=Date.now()+Number(dv)*36e5;
  await DB.set('coupons','C'+Date.now().toString(36),{code,type,value:type==='percent'?value:0,item:type==='free'||type==='other'?item:'',minOrder:num('#km'),limit:Number($('#kl').value)||0,creator:$('#kcr').value.trim(),perCustomer:$('#kpc').checked,expiresAt:exp,reward:false,active:true,used:0,usedBy:[],createdAt:Date.now()});
  closeSh();toast('Code created ✓')}
async function togCpn(id){const c=C.find(x=>x.id===id);await DB.set('coupons',id,{active:c.active===false})}
async function delCpn(id){if(confirm('Delete this code?'))await DB.del('coupons',id)}

function rSet(){
  return `<h2 style="margin-bottom:6px">Settings</h2><label>Store name</label><input class="f" id="sn" value="${esc(ST.name)}">
  <label>Delivery fee (₦, 0 for free)</label><input class="f money" id="sf" inputmode="numeric" value="${cm(ST.deliveryFee)}" placeholder="0">
  <label>Pickup address (shown to customers who choose pickup)</label><textarea class="f" id="sa" rows="2" placeholder="Shop 12, Main Market, Yola">${esc(ST.pickupAddress)}</textarea>
  <button class="btn" style="margin-top:14px;width:100%" onclick="saveSet()">Save settings</button>
  <button class="btn o" style="margin-top:10px;width:100%" onclick="seed();toast('Sample products and codes loaded')">Reload sample products</button>`}
async function saveSet(){await DB.set('settings','store',{name:$('#sn').value.trim()||'Dr Apple',deliveryFee:num('#sf'),pickupAddress:$('#sa').value.trim()});toast('Saved ✓');document.activeElement.blur()}
function theme(){const r=document.documentElement,d=r.dataset.t?r.dataset.t==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.t=d?'light':'dark';localStorage.setItem('t',r.dataset.t);const b=document.querySelector('#tg');if(b){b.classList.remove('spin');void b.offsetWidth;b.classList.add('spin')}}
</script>
